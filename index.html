/* ------------------------------------------------------------------ */
/* Local storage shim (mirrors the async window.storage API)           */
/* ------------------------------------------------------------------ */

const storage = {
  async get(key) {
    const raw = window.localStorage.getItem(key);
    if (raw === null) return null;
    return { key, value: raw };
  },
  async set(key, value) {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    window.localStorage.removeItem(key);
    return { key, deleted: true };
  },
};

const weightOf = (status) => (status === "consistent" ? 1 : status === "trying" ? 0.5 : 0);

function computeDimScore(practiceStatus, dim) {
  const items = PRACTICES.filter((p) => p.dim === dim);
  const sum = items.reduce((acc, p) => acc + weightOf(practiceStatus[p.id]), 0);
  return Math.round((sum / items.length) * 100);
}

/* ------------------------------------------------------------------ */

const RADAR_DIMS = ["M", "O", "R", "E"];

function radarPoint(i, valuePct, center, maxR) {
  const angle = (Math.PI / 180) * (-90 + i * 90);
  const r = (Math.max(0, Math.min(100, valuePct)) / 100) * maxR;
  return [center + r * Math.cos(angle), center + r * Math.sin(angle)];
}

function RadarChart({ scores, label = "Current" }) {
  const size = 300;
  const center = size / 2;
  const maxR = 96;
  const rings = [25, 50, 75, 100];

  const currentPts = RADAR_DIMS.map((d, i) => radarPoint(i, scores[d], center, maxR));
  const ultimatePts = RADAR_DIMS.map((d, i) => radarPoint(i, 100, center, maxR));
  const toPath = (pts) => pts.map((p) => p.join(",")).join(" ");

  return (
    <div className="radar-wrap">
      <svg viewBox={`0 0 ${size} ${size}`} className="radar-svg">
        {rings.map((lvl) => (
          <polygon key={lvl} points={toPath(RADAR_DIMS.map((d, i) => radarPoint(i, lvl, center, maxR)))} className="radar-ring" />
        ))}
        {RADAR_DIMS.map((d, i) => {
          const [x, y] = radarPoint(i, 100, center, maxR);
          return <line key={d} x1={center} y1={center} x2={x} y2={y} className="radar-axis" />;
        })}
        <polygon points={toPath(ultimatePts)} className="radar-ultimate" />
        <polygon points={toPath(currentPts)} className="radar-current" />
        {currentPts.map((p, i) => (
          <circle key={i} cx={p[0]} cy={p[1]} r={5.5} fill={DIMENSIONS[RADAR_DIMS[i]].color} stroke="#FCFBF8" strokeWidth="2" />
        ))}
        {RADAR_DIMS.map((d, i) => {
          const [x, y] = radarPoint(i, 122, center, maxR);
          return (
            <text key={d} x={x} y={y} textAnchor="middle" dominantBaseline="middle" className="radar-label" fill={DIMENSIONS[d].color}>
              {d} · {Math.round(scores[d])}%
            </text>
          );
        })}
      </svg>
      <div className="radar-legend">
        <span className="legend-item"><span className="legend-swatch legend-current" />{label}</span>
        <span className="legend-item"><span className="legend-swatch legend-ultimate" />Ultimate (all 40 practices)</span>
      </div>
    </div>
  );
}

function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const bigint = parseInt(h, 16);
  const r = (bigint >> 16) & 255, g = (bigint >> 8) & 255, b = bigint & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function badgeStyle(color, status) {
  if (status === "consistent") return { background: color, borderColor: color, color: "#FCFBF8", borderStyle: "solid" };
  if (status === "trying") return { background: hexToRgba(color, 0.24), borderColor: color, color: color, borderStyle: "solid" };
  return { background: "transparent", borderColor: color, color: color, borderStyle: "dashed" };
}

function PMBOKMap({ state, goToPractices }) {
  const currentPhase = state.project.phase;
  const counts = { consistent: 0, trying: 0, none: 0 };
  PRACTICES.forEach((p) => {
    const s = state.practiceStatus[p.id] || "none";
    counts[s] = (counts[s] || 0) + 1;
  });

  return (
    <div className="pmbok-wrap">
      <div className="pmbok-summary">
        <span><strong>{counts.consistent}</strong> of 40 consistent</span>
        <span className="sep">·</span>
        <span><strong>{counts.trying}</strong> trying</span>
        <span className="sep">·</span>
        <span><strong>{counts.none}</strong> not yet — the ultimate state is every cell filled</span>
      </div>
      <div className="pmbok-scroll">
        <table className="pmbok-table">
          <thead>
            <tr>
              <th className="pmbok-corner">
                <span className="pmbok-corner-top">Focus areas →</span>
                <span className="pmbok-corner-bottom">Performance domains ↓</span>
              </th>
              {PHASES.map((ph) => (
                <th key={ph} className={`pmbok-col-head ${ph === currentPhase ? "current" : ""}`}>
                  {ph === currentPhase && <span className="pmbok-here">You are here</span>}
                  {ph}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {DOMAINS.map((dom) => (
              <tr key={dom}>
                <th className="pmbok-row-head">{dom}</th>
                {PHASES.map((ph) => {
                  const cellPractices = PRACTICES.filter((p) => p.domain === dom && p.phase === ph);
                  return (
                    <td key={ph} className={`pmbok-cell ${ph === currentPhase ? "current" : ""}`}>
                      {cellPractices.length > 0 && (
                        <div className="pmbok-badges">
                          {cellPractices.map((p) => {
                            const status = state.practiceStatus[p.id] || "none";
                            return (
                              <button
                                key={p.id}
                                title={`${p.id} — ${p.title} (${status === "none" ? "not yet" : status})`}
                                className="pmbok-badge"
                                style={badgeStyle(DIMENSIONS[p.dim].color, status)}
                                onClick={() => goToPractices(p.dim)}
                              >
                                {p.dim}
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="pmbok-legend">
        <span className="legend-item"><span className="pmbok-badge" style={badgeStyle("#211F2B", "consistent")}>M</span>Consistent</span>
        <span className="legend-item"><span className="pmbok-badge" style={badgeStyle("#211F2B", "trying")}>M</span>Trying</span>
        <span className="legend-item"><span className="pmbok-badge" style={badgeStyle("#211F2B", "none")}>M</span>Not yet — the gap to the ultimate state</span>
      </div>
    </div>
  );
}

  { key: "coach", name: "Coach", desc: "Describe a real situation and get advice grounded in your project data and the 40 practices." },
];

function Guide({ setTab }) {
  return (
    <div className="pane guide-pane">
      <h1>How to use this tool</h1>
      <p className="hero-lede">
        This toolkit is built around PMI's M.O.R.E. framework — Manage Perceptions, Own Success,
        Relentlessly Reassess, Expand Perspective — a way of thinking about project success as
        value delivered, not just scope, schedule and budget hit on target. It works best as
        something you come back to over the life of a project, not a one-time form.
      </p>

      <section className="guide-steps">
        {GUIDE_STEPS.map((s) => (
          <div key={s.n} className="guide-step">
            <div className="guide-step-num">{s.n}</div>
            <div className="guide-step-body">
              <div className="guide-step-title">{s.title}</div>
              <div className="guide-step-desc">{s.desc}</div>
            </div>
          </div>
        ))}
      </section>

      <h2 className="guide-subhead">The four tabs at a glance</h2>
      <section className="guide-tabs-grid">
        {GUIDE_TAB_CARDS.map((t) => (
          <button key={t.key} className="guide-tab-card" onClick={() => setTab(t.key)}>
            <div className="guide-tab-name">{t.name}</div>
            <div className="guide-tab-desc">{t.desc}</div>
          </button>
        ))}
      </section>

      <div className="panel guide-notes">
        <h2>Good to know</h2>
        <ul className="guide-note-list">
          <li>Everything you enter — project name, phase, practice statuses, diagnostic answers — is saved only in this browser's local storage. Nothing is sent anywhere unless you use the Coach.</li>
          <li>The Coach is the one feature that needs setup: it calls Claude directly from your browser with your own Anthropic API key, entered once and stored locally. Every other tab works with no account and no key.</li>
          <li>Revisit the Practices tab as the project moves through phases — a practice that wasn't relevant in Initiating often becomes relevant once you're Executing.</li>
          <li>Use "Clear this project's data" at the bottom of the screen when you want to start fresh for a new project — it wipes the local record for a clean slate.</li>
        </ul>
      </div>

      <button className="cta primary" onClick={() => setTab("overview")}>Get started</button>
    </div>

}

function App() {
  const [loaded, setLoaded] = useState(false);
  const [state, setState] = useState(defaultState());
  const [tab, setTab] = useState("overview");
  const [dimFilter, setDimFilter] = useState(null);
  const [phaseOnly, setPhaseOnly] = useState(false);
  const [expanded, setExpanded] = useState({});
  const [diagStep, setDiagStep] = useState(0);
  const [diagDone, setDiagDone] = useState(false);
  const [toast, setToast] = useState("");
  const saveTimer = useRef(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await storage.get(STORAGE_KEY);
        if (!cancelled && res && res.value) {
          const parsed = JSON.parse(res.value);
          setState({ ...defaultState(), ...parsed });
          if (parsed.diagnostic && parsed.diagnostic.completedAt) setDiagDone(true);
        } else if (!cancelled) {
          // No saved state — this is a first-time visitor, so open on the Guide.
          setTab("guide");
        }
      } catch (e) {}
      finally { if (!cancelled) setLoaded(true); }
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try { await storage.set(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [state, loaded]);

  const setProject = (patch) => setState((s) => ({ ...s, project: { ...s.project, ...patch } }));
  const setPracticeStatus = (id, status) => setState((s) => ({ ...s, practiceStatus: { ...s.practiceStatus, [id]: status } }));
  const setDiagAnswer = (id, v) => setState((s) => ({ ...s, diagnostic: { ...s.diagnostic, answers: { ...s.diagnostic.answers, [id]: v } } }));

  const finishDiagnostic = () => {
    setState((s) => ({ ...s, diagnostic: { ...s.diagnostic, completedAt: new Date().toISOString() } }));
    setDiagDone(true);
  };

  const resetAll = async () => {
    setState(defaultState());
    setDiagDone(false);
    setDiagStep(0);
    try { await storage.delete(STORAGE_KEY); } catch (e) {}
    flash("Project data cleared.");
  };

  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2400); };

  const dimScores = {
    M: computeDimScore(state.practiceStatus, "M"),
    O: computeDimScore(state.practiceStatus, "O"),
    R: computeDimScore(state.practiceStatus, "R"),
    E: computeDimScore(state.practiceStatus, "E"),
  };
  const strongDims = Object.keys(dimScores).filter((k) => dimScores[k] >= 70);
  const overallCount = strongDims.length;

  const goToPractices = (dim) => { setDimFilter(dim); setTab("practices"); };

  if (!loaded) {
    return <div className="more-root more-loading"><div className="loading-mark">M·O·R·E</div></div>;
  }

  return (
    <div className="more-root">
      <aside className="rail">
        <div className="rail-word">
          {["M", "O", "R", "E"].map((k) => {
            const d = DIMENSIONS[k];
            const active = dimFilter === k;
            return (
              <button key={k} className={`rail-letter ${active ? "active" : ""}`} style={{ "--dim-color": d.color, "--dim-tint": d.tint }} onClick={() => goToPractices(active ? null : k)} title={d.name}>
                <span className="rail-letter-glyph">{k}</span>
                <span className="rail-letter-pct">{dimScores[k]}%</span>
              </button>
            );
          })}
        </div>
        <button className="rail-all" onClick={() => setDimFilter(null)}>View all</button>
      </aside>

      <div className="main-col">
        <header className="topbar">
          <div className="brand">
            <div className="brand-mark">M.O.R.E.</div>
            <div className="brand-sub">Toolkit for project professionals</div>
          </div>
          <div className="project-controls">
            <input className="project-name" placeholder="Name this project…" value={state.project.name} onChange={(e) => setProject({ name: e.target.value })} />
            <select className="phase-select" value={state.project.phase} onChange={(e) => setProject({ phase: e.target.value })}>
              {PHASES.map((p) => <option key={p} value={p}>{p}</option>)}
            </select>
          </div>
        </header>

        <nav className="tabs">
          {[["guide", "Guide"], ["overview", "Overview"], ["diagnose", "Diagnose"], ["practices", "Practices"], ["coach", "Coach"]].map(([key, label]) => (
            <button key={key} className={`tab ${tab === key ? "active" : ""}`} onClick={() => setTab(key)}>{label}</button>
          ))}
        </nav>

        <main className="content">
          {tab === "guide" && <Guide setTab={setTab} />}
          {tab === "overview" && <Overview state={state} dimScores={dimScores} overallCount={overallCount} goToPractices={goToPractices} setTab={setTab} />}
          {tab === "diagnose" && <Diagnose state={state} setDiagAnswer={setDiagAnswer} diagStep={diagStep} setDiagStep={setDiagStep} diagDone={diagDone} finishDiagnostic={finishDiagnostic} goToPractices={goToPractices} setDiagDone={setDiagDone} setDiagStep2={setDiagStep} />}
          {tab === "practices" && <Practices state={state} setPracticeStatus={setPracticeStatus} dimFilter={dimFilter} setDimFilter={setDimFilter} phaseOnly={phaseOnly} setPhaseOnly={setPhaseOnly} expanded={expanded} setExpanded={setExpanded} />}
          {tab === "coach" && <Coach state={state} dimScores={dimScores} />}
        </main>

        <footer className="app-footer">
          <span>Grounded in PMI's M.O.R.E. Playbook — 40 practices across Manage Perceptions, Own Success, Relentlessly Reassess, Expand Perspective. Runs entirely in your browser — no account, no server.</span>
          <button className="reset-link" onClick={resetAll}>Clear this project's data</button>
        </footer>
      </div>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function Overview({ state, dimScores, overallCount, goToPractices, setTab }) {
  const reviewedIds = new Set(Object.keys(state.practiceStatus));
  const reviewedCount = reviewedIds.size;
  const hasStarted = reviewedCount > 0;

  const spotlightAll = PRACTICES.filter((p) => p.spotlight);
  const spotlightReviewed = spotlightAll.filter((p) => reviewedIds.has(p.id));
  const spotlightGaps = spotlightReviewed
    .filter((p) => weightOf(state.practiceStatus[p.id]) < 1)
    .sort((a, b) => (a.phase === state.project.phase ? -1 : 0));

  const phaseAll = PRACTICES.filter((p) => p.phase === state.project.phase);
  const phaseReviewed = phaseAll.filter((p) => reviewedIds.has(p.id));
  const phaseRelevant = phaseReviewed.filter((p) => weightOf(state.practiceStatus[p.id]) < 1);

  return (
    <div className="pane">
      <section className="hero-block">
        <h1>{state.project.name ? state.project.name : "Your project"}<span className="hero-phase"> · {state.project.phase}</span></h1>
        <p className="hero-lede">
          You're consistently applying <strong>{overallCount} of 4</strong> M.O.R.E. elements on this project. PMI's research found that project success
          scores roughly {overallCount < 4 ? "climb" : "top out"} the more of these four you layer together — from a baseline in the high-20s with none applied,
          up into the low-90s when all four are consistently in play.
        </p>
      </section>

      <section className="gap-section">
        <div className="gap-heading">
          <h2>Current state vs. ultimate state</h2>
          <p className="panel-hint">
            This is PMI's own mapping of M.O.R.E. practices to the PMBOK Guide's focus areas and
            performance domains (playbook, p. 11) — filled in with your own progress. A solid badge
            means you've marked that practice consistent, a soft-filled badge means you're trying it,
            and an outlined badge is the gap between here and the ultimate state: every cell filled in.
            Your current phase is highlighted so you can see what's directly in front of you.
          </p>
        </div>
        <div className="panel">
          <PMBOKMap state={state} goToPractices={goToPractices} />
        </div>
      </section>

      <section className="dim-grid">
        {["M", "O", "R", "E"].map((k) => {
          const d = DIMENSIONS[k];
          return (
            <button key={k} className="dim-card" onClick={() => goToPractices(k)} style={{ "--c": d.color, "--t": d.tint }}>
              <div className="dim-card-top"><DimBadge dim={k} /><span className="dim-card-pct">{dimScores[k]}%</span></div>
              <div className="dim-card-name">{d.name}</div>
              <ProgressBar pct={dimScores[k]} color={d.color} track={d.tint} />
              <div className="dim-card-boost">+{d.boost} NPSS when applied consistently</div>
            </button>
          );
        })}
      </section>

      <section className="two-col">
        {!hasStarted ? (
          <div className="panel gate-panel">
            <h2>Personalized recommendations</h2>
            <p className="panel-hint">
              This fills in as you go through the practice tracker. Mark a few of the
              40 practices as Not yet, Trying, or Consistent, and your highest-leverage
              gaps and phase-relevant next steps will start showing up here — no need
              to finish all 40 first.
            </p>
            <ProgressBar pct={(reviewedCount / PRACTICES.length) * 100} color="#211F2B" track="#E9E6DD" />
            <div className="gate-count">{reviewedCount} / {PRACTICES.length} practices reviewed</div>
            <button className="cta primary" onClick={() => setTab("practices")}>Go review your practices</button>
          </div>
        ) : (
          <React.Fragment>
            <div className="panel">
              <h2>Highest-leverage practices you haven't locked in</h2>
              <p className="panel-hint">PMI's research flags these as high-impact but under-used — the biggest opportunity for differentiation.</p>
              {spotlightReviewed.length === 0 ? (
                <div className="empty-note">Review some spotlight practices in the Practices tab to see your biggest gaps here.</div>
              ) : spotlightGaps.length === 0 ? (
                <div className="empty-note">You've adopted every spotlight practice you've reviewed so far. Check the rest of the 40 for more.</div>
              ) : (
                <ul className="mini-list">
                  {spotlightGaps.slice(0, 5).map((p) => (
                    <li key={p.id} className="mini-item" onClick={() => goToPractices(p.dim)}><DimBadge dim={p.dim} size={22} /><span>{p.title}</span></li>
                  ))}
                </ul>
              )}
            </div>

            <div className="panel">
              <h2>Relevant right now: {state.project.phase}</h2>
              <p className="panel-hint">Practices the playbook maps to this phase of your project that you haven't marked as adopted yet.</p>
              {phaseReviewed.length === 0 ? (
                <div className="empty-note">Review some {state.project.phase.toLowerCase()}-phase practices in the Practices tab to see next steps here.</div>
              ) : phaseRelevant.length === 0 ? (
                <div className="empty-note">Nothing outstanding for this phase among what you've reviewed so far — you're covered.</div>
              ) : (
                <ul className="mini-list">
                  {phaseRelevant.slice(0, 5).map((p) => (
                    <li key={p.id} className="mini-item" onClick={() => goToPractices(p.dim)}><DimBadge dim={p.dim} size={22} /><span>{p.title}</span></li>
                  ))}
                </ul>
              )}
            </div>

            {reviewedCount < PRACTICES.length && (
              <div className="review-progress-note">
                Based on the {reviewedCount} of {PRACTICES.length} practices reviewed so far — mark more in the{" "}
                <button className="inline-link" onClick={() => setTab("practices")}>Practices tab</button> for a fuller picture.
              </div>
            )}
          </React.Fragment>
        )}
      </section>

      <section className="cta-row">
        <button className="cta primary" onClick={() => setTab("diagnose")}>Run the quick diagnostic</button>
        <button className="cta" onClick={() => setTab("coach")}>Ask the M.O.R.E. coach</button>
      </section>
    </div>
  );
}

function Diagnose({ state, setDiagAnswer, diagStep, setDiagStep, diagDone, finishDiagnostic, goToPractices, setDiagDone, setDiagStep2 }) {
  const answers = state.diagnostic.answers;
  const q = DIAGNOSTIC_QUESTIONS[diagStep];
  const answeredCount = Object.keys(answers).length;

  if (diagDone) {
    const scores = ["M", "O", "R", "E"].reduce((acc, dim) => {
      const items = DIAGNOSTIC_QUESTIONS.filter((qq) => qq.dim === dim);
      const sum = items.reduce((s, qq) => s + (answers[qq.id] || 0), 0);
      acc[dim] = Math.round((sum / (items.length * 4)) * 100);
      return acc;
    }, {});
    const weakest = ["M", "O", "R", "E"].sort((a, b) => scores[a] - scores[b])[0];

    return (
      <div className="pane">
        <h1>Your M.O.R.E. profile</h1>
        <p className="hero-lede">A self-read on where you naturally lean, based on your answers. Use it to decide where to spend deliberate effort next — not as a verdict.</p>
        <div className="diag-results">
          {["M", "O", "R", "E"].map((k) => {
            const d = DIMENSIONS[k];
            return (
              <div key={k} className="diag-row">
                <DimBadge dim={k} />
                <div className="diag-row-mid"><div className="diag-row-name">{d.name}</div><ProgressBar pct={scores[k]} color={d.color} track={d.tint} /></div>
                <div className="diag-row-pct">{scores[k]}%</div>
              </div>
            );
          })}
        </div>

        <div className="panel gap-panel" style={{ marginTop: 24, maxWidth: 420 }}>
          <h3>Self-read vs. ultimate state</h3>
          <RadarChart scores={scores} label="Self-assessed" />
        </div>

        <div className="panel" style={{ marginTop: 24 }}>
          <h2>Where to focus first</h2>
          <p className="panel-hint">Your lowest self-rating is <strong>{DIMENSIONS[weakest].name}</strong> ({DIMENSIONS[weakest].tagline.toLowerCase()}). That's usually where a small, deliberate change pays off fastest.</p>
          <button className="cta primary" onClick={() => goToPractices(weakest)}>See {DIMENSIONS[weakest].name} practices</button>
        </div>
        <button className="reset-link" style={{ marginTop: 20 }} onClick={() => { setDiagDone(false); setDiagStep2(0); }}>Retake the diagnostic</button>
      </div>
    );
  }

  return (
    <div className="pane">
      <h1>Quick diagnostic</h1>
      <p className="hero-lede">Twelve short prompts, three per M.O.R.E. element. Answer honestly — this is for your own calibration, not a test.</p>
      <div className="diag-progress"><ProgressBar pct={(answeredCount / DIAGNOSTIC_QUESTIONS.length) * 100} color="#211F2B" track="#E9E6DD" /><span>{answeredCount} / {DIAGNOSTIC_QUESTIONS.length}</span></div>
      <div className="diag-card" style={{ "--c": DIMENSIONS[q.dim].color, "--t": DIMENSIONS[q.dim].tint }}>
        <div className="diag-card-dim"><DimBadge dim={q.dim} size={28} /><span>{DIMENSIONS[q.dim].name}</span></div>
        <div className="diag-question">{q.text}</div>
        <div className="likert">
          {LIKERT.map((l) => (
            <button key={l.v} className={`likert-btn ${answers[q.id] === l.v ? "active" : ""}`} onClick={() => { setDiagAnswer(q.id, l.v); if (diagStep < DIAGNOSTIC_QUESTIONS.length - 1) setTimeout(() => setDiagStep(diagStep + 1), 180); }}>{l.label}</button>
          ))}
        </div>
        <div className="diag-nav">
          <button className="nav-btn" disabled={diagStep === 0} onClick={() => setDiagStep(Math.max(0, diagStep - 1))}>Back</button>
          <div className="diag-dots">{DIAGNOSTIC_QUESTIONS.map((qq, i) => <span key={qq.id} className={`dot ${i === diagStep ? "on" : ""} ${answers[qq.id] ? "done" : ""}`} />)}</div>
          {diagStep < DIAGNOSTIC_QUESTIONS.length - 1 ? (
            <button className="nav-btn" onClick={() => setDiagStep(diagStep + 1)}>Skip</button>
          ) : (
            <button className="nav-btn primary" disabled={answeredCount < DIAGNOSTIC_QUESTIONS.length} onClick={finishDiagnostic}>See results</button>
          )}
        </div>
      </div>
    </div>
  );
}

function Practices({ state, setPracticeStatus, dimFilter, setDimFilter, phaseOnly, setPhaseOnly, expanded, setExpanded }) {
  const dims = dimFilter ? [dimFilter] : ["M", "O", "R", "E"];
  return (
    <div className="pane">
      <div className="practices-head">
        <h1>Practice tracker</h1>
        <div className="filter-row">
          <div className="chip-group">
            <button className={`chip ${!dimFilter ? "active" : ""}`} onClick={() => setDimFilter(null)}>All</button>
            {["M", "O", "R", "E"].map((k) => (
              <button key={k} className={`chip ${dimFilter === k ? "active" : ""}`} style={{ "--c": DIMENSIONS[k].color }} onClick={() => setDimFilter(k)}>{k}</button>
            ))}
          </div>
          <label className="phase-toggle"><input type="checkbox" checked={phaseOnly} onChange={(e) => setPhaseOnly(e.target.checked)} />Only show {state.project.phase}</label>
        </div>
      </div>

      {dims.map((dimKey) => {
        const d = DIMENSIONS[dimKey];
        const categories = CATEGORY_ORDER[dimKey];
        return (
          <section key={dimKey} className="dim-section">
            <div className="dim-section-head" style={{ "--c": d.color }}>
              <DimBadge dim={dimKey} />
              <div><div className="dim-section-name">{d.name}</div><div className="dim-section-tag">{d.tagline}</div></div>
            </div>
            {categories.map((cat) => {
              const items = PRACTICES.filter((p) => p.dim === dimKey && p.category === cat && (!phaseOnly || p.phase === state.project.phase));
              if (items.length === 0) return null;
              return (
                <div key={cat} className="category-block">
                  <div className="category-label">{cat}</div>
                  {items.map((p) => {
                    const status = state.practiceStatus[p.id] || "none";
                    const isOpen = !!expanded[p.id];
                    return (
                      <div key={p.id} className="practice-row" style={{ "--c": d.color }}>
                        <div className="practice-row-main" onClick={() => setExpanded((e) => ({ ...e, [p.id]: !e[p.id] }))}>
                          <span className="practice-id">{p.id}</span>
                          <div className="practice-title-wrap">
                            <span className="practice-title">{p.title}{p.spotlight && <span className="spotlight-mark" title="High-impact, PMI research">✦</span>}</span>
                            <span className="practice-phase">{p.phase}</span>
                          </div>
                          <span className={`chevron ${isOpen ? "open" : ""}`}>›</span>
                        </div>
                        {isOpen && <div className="practice-guidance">{p.guidance}</div>}
                        <div className="status-row">
                          {[["none", "Not yet"], ["trying", "Trying"], ["consistent", "Consistent"]].map(([val, label]) => (
                            <button key={val} className={`status-btn ${status === val ? "active" : ""}`} onClick={() => setPracticeStatus(p.id, val)}>{label}</button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </section>
        );
      })}
    </div>
  );
}

function buildSystemPrompt(state, dimScores) {
  const notesLines = PRACTICES.map((p) => `${p.id} [${p.dim}] ${p.title} — ${p.guidance}`).join("\n");
  const statusSummary = ["M", "O", "R", "E"].map((k) => `${k} (${DIMENSIONS[k].name}): ${dimScores[k]}% adopted`).join("; ");
  const adopted = PRACTICES.filter((p) => state.practiceStatus[p.id] === "consistent").map((p) => p.id);
  const trying = PRACTICES.filter((p) => state.practiceStatus[p.id] === "trying").map((p) => p.id);

  return `You are a coach helping a project manager apply PMI's M.O.R.E. framework: Manage Perceptions, Own Success, Relentlessly Reassess, Expand Perspective. M.O.R.E. reframes project success as delivering value worth the effort and expense, not just hitting scope/time/budget.

Project context:
- Project: ${state.project.name || "(unnamed project)"}
- Current phase: ${state.project.phase}
- Adoption by dimension: ${statusSummary}
- Practices marked "consistent": ${adopted.length ? adopted.join(", ") : "none yet"}
- Practices marked "trying": ${trying.length ? trying.join(", ") : "none yet"}

The 40 M.O.R.E. practices (id, dimension, title — guidance) you can draw on:
${notesLines}

When the person describes a situation, ground your advice in specific practices from this list (cite the practice id and title). Keep answers practical, concrete, and short — a few sentences or a short list, not an essay. Recommend 1-3 practices at most per answer, prioritizing ones relevant to their current phase or weakest dimension when it fits. If their situation isn't covered by these practices, say so plainly and give your best general project-management advice. Do not invent case studies or statistics beyond what's given here.`;
}

function Coach({ state, dimScores }) {
  const [apiKey, setApiKey] = useState("");
  const [keyInput, setKeyInput] = useState("");
  const [keyLoaded, setKeyLoaded] = useState(false);
  const [showKeyField, setShowKeyField] = useState(false);
  const [messages, setMessages] = useState([
    { role: "assistant", content: "Tell me what's going on with your project and I'll point you to the M.O.R.E. practices that fit — or ask me anything about the framework itself." },
  ]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const scrollRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(API_KEY_STORAGE);
        if (res && res.value) setApiKey(res.value);
      } catch (e) {}
      setKeyLoaded(true);
    })();
  }, []);

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, busy]);

  const saveKey = async () => {
    const trimmed = keyInput.trim();
    if (!trimmed) return;
    await storage.set(API_KEY_STORAGE, trimmed);
    setApiKey(trimmed);
    setKeyInput("");
    setShowKeyField(false);
  };

  const clearKey = async () => {
    await storage.delete(API_KEY_STORAGE);
    setApiKey("");
  };

  const send = useCallback(async () => {
    const text = input.trim();
    if (!text || busy || !apiKey) return;
    setInput("");
    setErr("");
    const nextMessages = [...messages, { role: "user", content: text }];
    setMessages(nextMessages);
    setBusy(true);

    try {
      const apiMessages = nextMessages.filter((m) => m.role === "user" || m.role === "assistant").map((m) => ({ role: m.role, content: m.content }));
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: DEFAULT_MODEL,
          max_tokens: 1000,
          system: buildSystemPrompt(state, dimScores),
          messages: apiMessages,
        }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message || "API error");
      const textOut = (data.content || []).map((block) => (block.type === "text" ? block.text : "")).filter(Boolean).join("\n");
      setMessages((m) => [...m, { role: "assistant", content: textOut || "I couldn't generate a response — try rephrasing." }]);
    } catch (e) {
      setErr(`Couldn't reach the coach: ${e.message || "check your API key and try again."}`);
      setMessages((m) => m.slice(0, -1));
      setInput(text);
    } finally {
      setBusy(false);
    }
  }, [input, busy, messages, state, dimScores, apiKey]);

  if (!keyLoaded) return <div className="pane">Loading…</div>;

  if (!apiKey) {
    return (
      <div className="pane coach-pane">
        <div className="panel" style={{ maxWidth: 480 }}>
          <h2>Connect your Anthropic API key</h2>
          <p className="panel-hint">
            This runs entirely in your browser, so the coach needs its own key to talk to Claude.
            Get one at <strong>console.anthropic.com</strong> (API keys, not a claude.ai login). It's
            stored only in this browser's local storage and sent directly to Anthropic — never to
            any server of mine.
          </p>
          <div className="chat-input-row" style={{ marginTop: 4 }}>
            <input
              className="project-name"
              style={{ flex: 1, minWidth: 0 }}
              placeholder="sk-ant-…"
              type="password"
              value={keyInput}
              onChange={(e) => setKeyInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") saveKey(); }}
            />
            <button className="cta primary send-btn" onClick={saveKey} disabled={!keyInput.trim()}>Save</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="pane coach-pane">
      <div className="coach-context">
        <span>Coaching for <strong>{state.project.name || "your project"}</strong></span>
        <span className="sep">·</span><span>{state.project.phase}</span>
        <span className="sep">·</span>
        <span>Strongest: {["M", "O", "R", "E"].sort((a, b) => dimScores[b] - dimScores[a])[0]} · Focus: {["M", "O", "R", "E"].sort((a, b) => dimScores[a] - dimScores[b])[0]}</span>
        <span className="sep">·</span>
        <button className="reset-link" onClick={clearKey}>Remove API key</button>
      </div>

      <div className="chat-window" ref={scrollRef}>
        {messages.map((m, i) => (
          <div key={i} className={`bubble-row ${m.role}`}><div className={`bubble ${m.role}`}>{m.content}</div></div>
        ))}
        {busy && (
          <div className="bubble-row assistant"><div className="bubble assistant typing"><span className="dot-flash" /><span className="dot-flash" /><span className="dot-flash" /></div></div>
        )}
      </div>

      {err && <div className="coach-error">{err}</div>}

      <div className="chat-input-row">
        <textarea
          rows={2}
          placeholder="Describe your situation — e.g. “A key stakeholder thinks this project is failing even though we're on schedule.”"
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
        />
        <button className="cta primary send-btn" onClick={send} disabled={busy || !input.trim()}>Send</button>
      </div>
    </div>
  );
}
